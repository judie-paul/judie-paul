name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"   # daily at midnight UTC
  workflow_dispatch:       # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Runs first so the normal runner user creates dist/ (the snake step runs as root in Docker)
      - name: Draw dated contribution calendar
        run: python .github/scripts/calendar.py
        env:
          GITHUB_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUT_DIR: dist

      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#8b6cf0&color_dots=#ebedf0,#e4d9ff,#c4a7ff,#9f7aea,#6b46c1
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#e879f9&color_dots=#1c1630,#3b2a6b,#5b3fa0,#8b6cf0,#c4a7ff&color_background=#0f0b1e

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
