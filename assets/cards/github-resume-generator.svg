<svg xmlns="http://www.w3.org/2000/svg" width="280" height="190" viewBox="0 0 280 190" font-family="'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif" role="img" aria-label="GitHub → Resume">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#16102e"/><stop offset="1" stop-color="#0f0b1e"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f0abfc"/><stop offset="1" stop-color="#c026d3"/></linearGradient>
<linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#f0abfc" stop-opacity="0"/><stop offset=".5" stop-color="#f0abfc" stop-opacity=".9"/><stop offset="1" stop-color="#f0abfc" stop-opacity="0"/></linearGradient>
<clipPath id="c"><rect width="280" height="190" rx="14"/></clipPath>
</defs>
<style>
.s{animation:mv 6s ease-in-out -9.1s infinite}
@keyframes mv{0%{transform:translateX(-160px)}60%,100%{transform:translateX(300px)}}
.lv{animation:pu 2s ease-in-out infinite}
@keyframes pu{0%,100%{opacity:1}50%{opacity:.3}}
</style>
<g clip-path="url(#c)">
<rect width="280" height="190" fill="url(#bg)"/>
<rect width="4" height="190" fill="url(#edge)"/>
<rect class="s" x="0" y="0" width="140" height="2" fill="url(#sh)"/>
</g>
<rect x=".5" y=".5" width="279" height="189" rx="14" fill="none" stroke="#3b2a6b"/>
<text x="24" y="42" fill="#ede7ff" font-size="17" font-weight="700">GitHub → Resume</text>
<text x="256" y="42" fill="#f0abfc" font-size="16" text-anchor="end">↗</text>
<text x="24" y="76" fill="#c3b6e6" font-size="13">Turns a public GitHub profile into</text><text x="24" y="95" fill="#c3b6e6" font-size="13">an editable, ATS-friendly resume</text><text x="24" y="114" fill="#c3b6e6" font-size="13">with validated AI output and PDF</text><text x="24" y="133" fill="#c3b6e6" font-size="13">export.</text>
<circle cx="30" cy="168" r="5" fill="#00ADD8"/><text x="42" y="172" fill="#a99cc8" font-size="12">Go</text>
</svg>
