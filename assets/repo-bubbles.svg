<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 760" width="800" height="760" font-family="'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif" role="img" aria-label="10 public repositories as floating bubbles">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d0a1c"/><stop offset="1" stop-color="#1d1540"/></linearGradient>
<radialGradient id="glass" cx=".32" cy=".25" r=".95"><stop offset="0" stop-color="#2b2058"/><stop offset="1" stop-color="#110c26"/></radialGradient>
<linearGradient id="rG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9ddff"/><stop offset="1" stop-color="#8b6cf0"/></linearGradient>
<linearGradient id="rA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbe2ff"/><stop offset="1" stop-color="#c026d3"/></linearGradient>
<linearGradient id="rV" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#dbe1ff"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
<radialGradient id="hG"><stop offset=".7" stop-color="#c4a7ff" stop-opacity=".16"/><stop offset="1" stop-color="#c4a7ff" stop-opacity="0"/></radialGradient>
<radialGradient id="hA"><stop offset=".7" stop-color="#f0abfc" stop-opacity=".16"/><stop offset="1" stop-color="#f0abfc" stop-opacity="0"/></radialGradient>
<radialGradient id="hV"><stop offset=".7" stop-color="#a5b4fc" stop-opacity=".18"/><stop offset="1" stop-color="#a5b4fc" stop-opacity="0"/></radialGradient>
</defs>
<style>
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.b1{animation:fl 6.4s ease-in-out -0.9s infinite}
.b2{animation:fl 6.8s ease-in-out -1.8s infinite}
.b3{animation:fl 7.2s ease-in-out -2.7s infinite}
.b4{animation:fl 6.0s ease-in-out -3.6s infinite}
.b5{animation:fl 6.4s ease-in-out -4.5s infinite}
.b6{animation:fl 6.8s ease-in-out -5.4s infinite}
.b7{animation:fl 7.2s ease-in-out -6.3s infinite}
.b8{animation:fl 6.0s ease-in-out -7.2s infinite}
.b9{animation:fl 6.4s ease-in-out -8.1s infinite}
.b10{animation:fl 6.8s ease-in-out -9.0s infinite}
.lv{animation:pu 2s ease-in-out infinite}
@keyframes pu{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){[class^="b"],.lv{animation:none}}
</style>
<rect width="800" height="760" rx="22" fill="url(#bg)"/>
<text x="40" y="58" fill="#fff" font-size="28" font-weight="800">Projects</text>
<text x="40" y="82" fill="#c3b6e6" font-size="14">10 public repos</text>
<circle cx="46" cy="130" r="5" fill="#c4a7ff"/><text x="60" y="135" fill="#c4a7ff" font-size="15" font-weight="700">AI evaluation &amp; data quality</text><line x1="323" y1="130" x2="760" y2="130" stroke="#fff" stroke-opacity=".12"/>
<circle cx="46" cy="345" r="5" fill="#f0abfc"/><text x="60" y="350" fill="#f0abfc" font-size="15" font-weight="700">Grounded AI apps · no made-up sources</text><line x1="400" y1="345" x2="760" y2="345" stroke="#fff" stroke-opacity=".12"/>
<circle cx="46" cy="560" r="5" fill="#a5b4fc"/><text x="60" y="565" fill="#a5b4fc" font-size="15" font-weight="700">Web apps</text><line x1="151" y1="560" x2="760" y2="560" stroke="#fff" stroke-opacity=".12"/>
<g transform="translate(130 225)"><g class="b1"><circle r="88" fill="url(#hG)"/><circle r="72" fill="url(#glass)" stroke="url(#rG)" stroke-width="2.5"/><text x="0" y="-5.0" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">patchbench</text><text x="0" y="17.0" text-anchor="middle" fill="#c3b6e6" font-size="11">patch evaluation</text></g></g>
<g transform="translate(310 225)"><g class="b2"><circle r="88" fill="url(#hG)"/><circle r="72" fill="url(#glass)" stroke="url(#rG)" stroke-width="2.5"/><text x="0" y="-5.0" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">judgecheck</text><text x="0" y="17.0" text-anchor="middle" fill="#c3b6e6" font-size="11">LLM-judge bias</text></g></g>
<g transform="translate(490 225)"><g class="b3"><circle r="88" fill="url(#hG)"/><circle r="72" fill="url(#glass)" stroke="url(#rG)" stroke-width="2.5"/><text x="0" y="-5.0" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">rubricops</text><text x="0" y="17.0" text-anchor="middle" fill="#c3b6e6" font-size="11">rubrics · kappa</text></g></g>
<g transform="translate(670 225)"><g class="b4"><circle r="88" fill="url(#hG)"/><circle r="72" fill="url(#glass)" stroke="url(#rG)" stroke-width="2.5"/><text x="0" y="-5.0" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">labellint</text><text x="0" y="17.0" text-anchor="middle" fill="#c3b6e6" font-size="11">label auditing</text></g></g>
<g transform="translate(190 440)"><g class="b5"><circle r="88" fill="url(#hA)"/><circle r="72" fill="url(#glass)" stroke="url(#rA)" stroke-width="2.5"/><text x="0" y="-13.5" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">reference-based-</text><text x="0" y="3.5" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">revision-tool</text><text x="0" y="25.5" text-anchor="middle" fill="#c3b6e6" font-size="11">cited exam answers</text></g></g>
<g transform="translate(400 440)"><g class="b6"><circle r="88" fill="url(#hA)"/><circle r="72" fill="url(#glass)" stroke="url(#rA)" stroke-width="2.5"/><text x="0" y="-13.5" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">github-resume-</text><text x="0" y="3.5" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">generator</text><text x="0" y="25.5" text-anchor="middle" fill="#c3b6e6" font-size="11">GitHub → resume</text></g></g>
<g transform="translate(610 440)"><g class="b7"><circle r="88" fill="url(#hA)"/><circle r="72" fill="url(#glass)" stroke="url(#rA)" stroke-width="2.5"/><text x="0" y="-5.0" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">citewise-ai</text><text x="0" y="17.0" text-anchor="middle" fill="#c3b6e6" font-size="11">real references</text></g></g>
<g transform="translate(190 655)"><g class="b8"><circle r="88" fill="url(#hV)"/><circle r="72" fill="url(#glass)" stroke="url(#rV)" stroke-width="2.5"/><text x="0" y="-5.0" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">shoebox</text><text x="0" y="17.0" text-anchor="middle" fill="#c3b6e6" font-size="11">Go · SQLite store</text></g></g>
<g transform="translate(400 655)"><g class="b9"><circle r="88" fill="url(#hV)"/><circle r="72" fill="url(#glass)" stroke="url(#rV)" stroke-width="2.5"/><text x="0" y="-22.0" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">school-</text><text x="0" y="-5.0" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">management-</text><text x="0" y="12.0" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">system</text><text x="0" y="34.0" text-anchor="middle" fill="#c3b6e6" font-size="11">Go web app</text></g></g>
<g transform="translate(610 655)"><g class="b10"><circle r="88" fill="url(#hV)"/><circle r="72" fill="url(#glass)" stroke="url(#rV)" stroke-width="2.5"/><text x="0" y="-13.5" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">contractor-</text><text x="0" y="3.5" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">application</text><text x="0" y="25.5" text-anchor="middle" fill="#c3b6e6" font-size="11">Airtable pipeline</text></g></g>
</svg>
